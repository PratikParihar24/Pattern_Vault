<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — MindMaster</title>
    <meta name="description"
        content="Login to MindMaster and pick up where you left off. Access your account and the global leaderboard.">
    <link rel="stylesheet" href="css/kuizu-theme.css">
    <style>
        body.kuizu-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 60px;
            position: relative;
            overflow: hidden;
        }

        .auth-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 60% at 30% 40%, rgba(233, 69, 96, 0.08), transparent 60%),
                radial-gradient(ellipse 50% 50% at 70% 60%, rgba(167, 139, 250, 0.07), transparent 60%);
            pointer-events: none;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-xl);
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
            box-shadow: var(--shadow-lg);
            animation: kz-scale-in 0.4s var(--ease-bounce);
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-primary);
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        }

        .auth-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
            text-align: center;
        }

        .auth-logo .kz-logo-icon {
            width: 56px;
            height: 56px;
            font-size: 1.6rem;
            margin-bottom: 12px;
            box-shadow: 0 8px 24px var(--primary-glow);
        }

        .auth-logo h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .auth-logo p {
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .auth-divider {
            position: relative;
            text-align: center;
            margin: 24px 0;
        }

        .auth-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--border-subtle);
        }

        .auth-divider span {
            position: relative;
            background: var(--bg-card);
            padding: 0 12px;
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        .auth-submit {
            width: 100%;
            padding: 15px;
            border-radius: var(--radius-pill);
            background: var(--gradient-primary);
            color: #fff;
            border: none;
            font-family: 'Nunito', sans-serif;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 4px 16px var(--primary-glow);
            margin-top: 8px;
        }

        .auth-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(233, 69, 96, 0.4);
        }

        .auth-submit:active {
            transform: scale(0.98);
        }

        .auth-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .auth-msg {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
        }

        .auth-msg.error {
            background: rgba(233, 69, 96, 0.1);
            border: 1px solid rgba(233, 69, 96, 0.3);
            color: var(--primary);
        }

        .auth-msg.success {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: var(--accent-green);
        }
    </style>
</head>

<body class="kuizu-page">

    <!-- NAVBAR -->
    <nav class="kz-navbar scrolled" id="navbar">
        <div class="kz-nav-inner">
            <a href="landing.html" class="kz-logo">
                <div class="kz-logo-icon">🧠</div>
                <span class="kz-logo-text">Mind<span>Master</span></span>
            </a>
            <ul class="kz-nav-links">
                <li><a href="landing.html">Home</a></li>
                <li><a href="how-to-play.html">How to Play</a></li>
                <li><a href="leaderboard.html">Leaderboard</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="faq.html">FAQ</a></li>
            </ul>
            <div class="kz-nav-actions">
                <a href="register.html" class="kz-btn kz-btn-primary kz-btn-sm">Register Free</a>
            </div>
            <button class="kz-hamburger" id="hamburger"><span></span><span></span><span></span></button>
        </div>
    </nav>
    <div class="kz-mobile-nav" id="mobileNav">
        <a href="landing.html">🏠 Home</a>
        <a href="how-to-play.html">🎮 How to Play</a>
        <a href="leaderboard.html">🏆 Leaderboard</a>
        <a href="about.html">💡 About</a>
        <a href="faq.html">❓ FAQ</a>
        <hr style="border-color:var(--border-subtle); margin:8px 0;">
        <a href="register.html"
            style="background:var(--gradient-primary);color:#fff;text-align:center;border-radius:var(--radius-pill);">Register
            Free</a>
    </div>

    <!-- AUTH CARD -->
    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="kz-logo-icon">🧠</div>
                <h2>Welcome Back</h2>
                <p>Login to access your account and the global leaderboard</p>
            </div>

            <form id="login-form">
                <div class="kz-form-group">
                    <label class="kz-label-text" for="email">Email Address</label>
                    <input class="kz-input" type="email" id="email" name="email" placeholder="your@email.com" required
                        autocomplete="email">
                </div>

                <div class="kz-form-group">
                    <label class="kz-label-text" for="password">Password</label>
                    <input class="kz-input" type="password" id="password" name="password" placeholder="••••••••"
                        required autocomplete="current-password">
                </div>

                <button type="submit" class="auth-submit" id="login-btn">
                    🎮 Login & Play
                </button>
            </form>

            <div class="auth-msg" id="auth-msg"></div>

            <div class="auth-divider"><span>or</span></div>

            <div class="auth-footer">
                New player? <a href="register.html">Create a free account →</a>
            </div>
        </div>
    </main>

    <script src="js/landing.js"></script>
    <script>
        // If user navigates to login page while already logged in, redirect them back to home
        if (localStorage.getItem('token')) {
            window.location.replace('landing.html');
        } else {
            // Only clear pattern state if actually not logged in
            sessionStorage.removeItem('patternFailed');
        }

        const form = document.getElementById('login-form');
        const btn = document.getElementById('login-btn');
        const msgBox = document.getElementById('auth-msg');

        function showMsg(text, type = 'error') {
            msgBox.textContent = text;
            msgBox.className = `auth-msg ${type}`;
            msgBox.style.display = 'block';
        }

        // Handle browser back button caching (bfcache)
        window.addEventListener('pageshow', (e) => {
            if (localStorage.getItem('token')) {
                window.location.replace('landing.html');
            } else if (e.persisted) {
                btn.disabled = false;
                btn.textContent = '🎮 Login & Play';
                msgBox.style.display = 'none';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = 'Logging in...';
            msgBox.style.display = 'none';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    // Login successful → store token → go to quiz/vault
                    localStorage.setItem('token', data.token);
                    showMsg('Login successful! Loading...', 'success');
                    setTimeout(() => {
                        window.location.href = 'app.html';
                    }, 500);
                } else {
                    showMsg(data.msg || 'Login failed', 'error');
                    btn.disabled = false;
                    btn.textContent = '🎮 Login & Play';
                }
            } catch (err) {
                showMsg('Server error. Please try again.', 'error');
                btn.disabled = false;
                btn.textContent = '🎮 Login & Play';
            }
        });
    </script>
</body>

</html>
